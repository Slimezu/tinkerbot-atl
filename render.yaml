services:
  - type: web
    name: tinkerbot-atl
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: GGUF_DIR
        value: /var/data
    disk:
      name: tinkerbot-model-disk
      mountPath: /var/data
      sizeGB: 5
